<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第二幕 · 一起完成的黑板报</title>
<link rel="stylesheet" href="board.css">
<script>
/* Windows 开着「自动隐藏任务栏」时，任务栏一弹出来就压在页面最底下 48px 上——
   第二幕的画笔工具条正好在那儿，鼠标往下走它就盖住按钮。
   判断：工作区高度 == 整屏高度（任务栏不占位 = 自动隐藏）、窗口贴着屏幕底边、
   且还留着浏览器标题栏的高度（不是 F11 全屏）。命中时给底部 UI 留安全区。 */
(function () {
  var root = document.documentElement;
  function fit() {
    var s = window.screen;
    var chrome = window.outerHeight - window.innerHeight;
    var autoHide = !!s && s.availHeight >= s.height - 1;
    var atBottom = !!s && window.screenY + window.outerHeight >= s.availHeight - 2;
    root.style.setProperty("--safe-b", autoHide && atBottom && chrome > 0 ? "52px" : "0px");
  }
  fit();
  window.addEventListener("resize", fit);
})();
</script>
</head>
<body>
<div id="stage" class="cinematic">
  <div id="frame">
    <div id="screen">
      <canvas id="game" width="512" height="288"></canvas>

      <div id="prog">
        <span data-k="title">标题</span>
        <span data-k="frame">边框</span>
        <span data-k="main">主图</span>
        <span data-k="deco">装饰</span>
      </div>

      <div id="dlg">
        <b id="dlgWho"></b>
        <p id="dlgLine"></p>
        <small>E / 空格 / 点击</small>
      </div>

      <!-- 随时能走：画板期间一直在左上角，Esc 同效 -->
      <button id="leave" title="离开黑板（Esc）">离开</button>

      <div id="bye">
        <h2>先到这儿</h2>
        <p id="byeLine"></p>
        <p class="note">这张板已经存好了，下次进来接着画。</p>
        <div class="row">
          <button id="resume">接着画</button>
          <button id="nextBroadcast">先去广播室</button>
          <button id="quit">离开</button>
        </div>
      </div>

      <div id="card">
        <h2>第二幕 · 一起完成的黑板报</h2>
        <p>这张图是你和她一起画的。</p>
        <div class="row">
          <a id="download" download="黑板报.png">下载这张 PNG</a>
          <button id="look">看看</button>
          <button id="again">再画一次</button>
          <button id="nextBroadcastDone">继续 · 广播室</button>
          <button id="out">离开</button>
        </div>
      </div>

      <input id="textin" type="text" maxlength="12" placeholder="写标题，回车确认" autocomplete="off">

      <div id="loading" class="show">加载中…</div>
    </div>
  </div>

  <div id="pats"></div>

  <!-- 画板期间的对白走这里：左边朱里、右边和臣，中间一个对话框。
       整条在画布**下面**，不压黑板——这块板才是玩家要看的东西。 -->
  <div id="subs" data-who="朱里">
    <div class="pix her" aria-hidden="true"><i></i></div>
    <div class="bubble">
      <b id="subsWho"></b>
      <span id="subsLine"></span>
      <!-- 主题三选一 / 粉笔二选一的选择题摆在这儿：对白区里直接选，不弹新窗口 -->
      <span id="pick" class="pick" hidden></span>
    </div>
    <div class="pix me" aria-hidden="true"><i></i></div>
  </div>

  <div id="bar">
    <div id="tools"></div>
    <div id="widths"></div>
    <div id="status">
      <span id="hint"></span>
    </div>
    <div id="palette"></div>
    <button id="finish" disabled>完成黑板报</button>
  </div>
</div>

<script src="../audio/bgm.js"></script>
<script src="lines.js"></script>
<script src="patterns.js"></script>
<script src="ghost-art.js"></script>
<script src="board.js"></script>
<script src="girl.js"></script>
<script src="scene2.js"></script>
</body>
</html>
