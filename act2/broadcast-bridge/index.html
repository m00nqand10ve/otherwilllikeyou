<html lang="zh-CN">
<head>
  <meta charset="utf-8">

<body>
  <main id="stage" aria-label="从黑板报到广播室的过场">

    <img id="cg" src="assets/cg_turn_to_zhuli_single_desk.png" alt="朱里拿着稿纸走进广播室，和臣坐在同一张播音桌前回头看她" hidden>
    <div id="shade"></div>
    <div id="chapter">CHAPTER 02 / ORDINARY DAYS</div>
    <div id="dialog" hidden><b id="who"></b><p id="line"></p><small>E / 空格 / 点击</small></div>

      <span id="hint"></span>
      <button id="walk" type="button">走过去</button>
      <button id="act" type="button" hidden>推门进入</button>

    <div id="ready" hidden>
      <h1>两个人都到了</h1>
      <p>稿纸摊开，麦克风在眼前。朱里把她那份稿子放好，偏头看了我一眼。</p>
      <p>“那开始吧。”</p>
      <small>接下来试音，然后开始晚间广播</small>
      <div class="actions">
        <a id="start-broadcast" href="../../act3/broadcast.html?from=bridge">开始广播</a>
        <button id="replay" type="button">重看这段</button>
        <a href="../blackboard.html">返回黑板报</a>
      </div>
    </div>
