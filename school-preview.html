<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我们的故事 · 第二幕</title><style>
:root{--ink:#1b1418;--paper:#f2e9da;--accent:#c96b5a;--panel:rgba(15,12,16,.86)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{background:#050407;color:var(--paper);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
main{position:fixed;inset:0;overflow:hidden}

/* 第二幕与第一幕共用同一块 16:9 舞台：铺满时正好落满视口，比例不同时居中留边。 */
.stage{position:absolute;left:50%;top:50%;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));transform:translate(-50%,-50%);overflow:hidden;background:linear-gradient(#4282b9,#b7d2db 70%,#e5bf9d);container-type:size;border:0;box-shadow:none}
@supports(height:100dvh){.stage{width:min(100vw,calc(100dvh*16/9));height:min(100dvh,calc(100vw*9/16))}}
.stage>img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.stage>img.camera-down{animation:cameraDown 5s ease-in-out both}
.stage>img.cg-reveal{animation:cgReveal .7s ease-out both}
@keyframes cgReveal{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
.stage>img.look-door,.stage>img.look-door ~ #people{transform:scale(1.18) translateX(8%);transform-origin:20% 45%;transition:transform 1.2s ease}
#people{position:absolute;inset:0;z-index:2;pointer-events:none;transition:transform 1.2s ease}
#openDoor{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none;clip-path:inset(13% 81% 40% 1.5%);opacity:0;transition:opacity .85s}
#openDoor.open{opacity:1}
#doorLeaf{position:absolute;left:5.7%;top:16.7%;width:11.2%;height:40%;z-index:2;pointer-events:none;transform-origin:left center;image-rendering:pixelated}
#doorLeaf.swing{animation:doorSwing .95s ease-in-out forwards}
@keyframes doorSwing{from{transform:perspective(500px) rotateY(0);opacity:1}to{transform:perspective(500px) rotateY(-83deg);opacity:0}}
@keyframes cameraDown{0%{transform:translateY(85%) scale(1.12)}100%{transform:translateY(0) scale(1)}}

/* HUD：和第一幕相同的顶部信息条、提示、对话框。 */
.hud{position:absolute;inset:0;z-index:10;pointer-events:none;font-size:clamp(10px,1.25cqw,26px);letter-spacing:.04em}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:1em;padding:.7em 1.1em 1.7em;color:rgba(242,233,218,.82);text-shadow:0 1px 0 rgba(0,0,0,.7);background:linear-gradient(180deg,rgba(10,8,12,.64),rgba(10,8,12,0))}
.act-heading{display:block;margin:0;font:inherit;font-weight:400;color:inherit}
.topbar b{color:var(--paper);font-weight:600}
.goal{display:block;margin-top:.3em;font-size:.8em;letter-spacing:.16em;color:rgba(255,201,143,.9);text-shadow:0 1px 0 rgba(0,0,0,.7)}
.keys{white-space:nowrap}
@media(max-width:760px){.keys{display:none}}

.hot{position:absolute;z-index:6;transform:translate(-50%,-50%);white-space:nowrap;background:var(--panel);border:1px solid rgba(242,233,218,.25);border-radius:3px;padding:.3em .65em;font-size:clamp(11px,1.4cqw,28px);letter-spacing:.04em;color:var(--paper)}
.hot kbd{display:inline-block;padding:0 5px;margin-right:5px;border:1px solid rgba(242,233,218,.45);border-bottom-width:2px;border-radius:3px;font-family:inherit;font-size:.9em}

.dialog{position:absolute;left:6%;right:6%;bottom:6%;z-index:7;min-height:15%;padding:.8em 1.2em .95em;background:var(--panel);border:1px solid rgba(242,233,218,.22);box-shadow:0 8px 28px rgba(0,0,0,.35);letter-spacing:.04em;opacity:0;transform:translateY(6px);transition:opacity .22s ease,transform .22s ease}
.dialog.show{opacity:1;transform:translateY(0)}
.dialog b{display:block;margin-bottom:6px;color:var(--accent);font-size:.82em;font-weight:400;letter-spacing:.18em}
.dialog p{margin:0;font-size:clamp(13px,1.75cqw,34px);line-height:1.75;min-height:1.75em;white-space:pre-wrap}
.dialog small{position:absolute;right:.9em;bottom:.55em;color:rgba(242,233,218,.55);font-size:.82em}

.panel{position:absolute;z-index:5;inset:5% 7%;overflow:auto;background:var(--panel);border:1px solid rgba(242,233,218,.22);box-shadow:0 8px 28px rgba(0,0,0,.35);padding:1em 1.2em;color:var(--paper);font-size:clamp(11px,1.15cqw,24px);letter-spacing:.04em}
.panel h2{margin:0 0 .55em;font-size:1.35em;font-weight:600;letter-spacing:.08em;color:var(--paper)}
.panel p{margin:.4em 0;line-height:1.7;color:rgba(242,233,218,.78)}
.panel button{font:inherit;color:var(--paper);background:rgba(242,233,218,.06);border:1px solid rgba(242,233,218,.28);border-radius:3px;padding:.35em .8em;cursor:pointer;letter-spacing:.04em}
.panel button:hover,.panel button:focus-visible{background:rgba(201,107,90,.22);border-color:var(--accent);outline:none}
.panel button.selected{background:rgba(201,107,90,.35);border-color:var(--accent)}
.panel.choice-panel{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,86%);max-height:80%;background:var(--panel)}
.choice-panel .row{margin-top:1.2em}
.row{display:flex;flex-wrap:wrap;gap:.5em;margin:.7em 0}
.board{display:block;width:100%;height:min(40vh,350px);background:#285147;border:8px solid #8e654a;image-rendering:pixelated;touch-action:none}
.selected{background:rgba(201,107,90,.35)}
.track{height:34px;background:#443b40;position:relative;margin:16px 0}
.track:before{content:'';position:absolute;left:44%;width:12%;height:100%;background:#8baf83}
.cursor{position:absolute;left:0;top:0;height:100%;width:3px;background:#f9dcb4}

.sky{position:absolute;inset:0;background:linear-gradient(#4684b6,#b9d3d7 70%,#eacba6);display:grid;place-items:center;font-size:45px}
.actor{position:absolute;z-index:2;bottom:12%;width:8%;aspect-ratio:2/3;background-repeat:no-repeat;background-size:2300% 100%;background-position:left top;image-rendering:pixelated;filter:drop-shadow(2px 3px 2px #0009);transition:left .25s}
.actor.me{background-image:url("assets/characters/boy/boy_sheet.png")}
.actor.her{background-image:url("assets/characters/girl/girl_sheet.png");background-size:2500% 100%}
.actor.sitting{background-position:100% top;bottom:20%}
.stage.corridor-view .actor{width:16%;bottom:24%}
.actor.at-door{bottom:43%;width:8%}
.actor.moving{transition:left .16s linear,bottom .16s linear,width .16s linear}
.actor.exiting{transition:left .85s ease-in,bottom .85s ease-in,width .85s ease-in,opacity .7s ease-in}
.actor.approaching{transition:none}
.actor.her.waving{animation:herWave .5s steps(1) infinite}
@keyframes herWave{0%,49%{background-position:95.8333% top}50%,100%{background-position:100% top}}
.extra{position:absolute;z-index:2;aspect-ratio:2/3;background:url("assets/characters/npc_generated/boy_sit.gif") no-repeat left top;background-size:100% 100%;image-rendering:pixelated;filter:drop-shadow(1px 2px 1px #0007)}
.extra.girl{background-image:url("assets/characters/npc_generated/girl_sit.gif")}

.door-controls{position:absolute;z-index:6;left:50%;bottom:8%;transform:translateX(-50%);background:var(--panel);border:1px solid rgba(242,233,218,.25);border-radius:3px;padding:.4em .85em;max-width:72%;font-size:clamp(10px,1.15cqw,24px);letter-spacing:.04em;text-align:center}
.door-controls p{margin:0}
.door-controls kbd{display:inline-block;padding:0 5px;border:1px solid rgba(242,233,218,.45);border-bottom-width:2px;border-radius:3px;font-family:inherit;font-size:.9em}
.board-ui{position:absolute;z-index:5;left:6%;right:6%;bottom:2%;background:var(--panel);border:1px solid rgba(242,233,218,.22);padding:.6em .8em;font-size:clamp(10px,1.1cqw,22px)}
.board-ui p{margin:.3em}
.board-in-room{position:absolute;z-index:4;left:44.8%;top:14%;width:22%;height:24.6%;background:#285147;image-rendering:pixelated;touch-action:none;border:2px solid #765442}

.end{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1em;background:#050407;text-align:center}
.end small{max-width:92%;font-size:clamp(9px,1.05cqw,21px);line-height:1.9;letter-spacing:.34em;color:rgba(242,233,218,.42)}
.end .end-title{font-size:clamp(18px,3cqw,58px);letter-spacing:.16em;color:var(--paper);text-shadow:0 2px 18px rgba(0,0,0,.8)}
.end .hint{font-size:clamp(9px,1.05cqw,21px);letter-spacing:.34em;color:rgba(242,233,218,.55)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note{color:rgba(242,233,218,.62);font-size:.9em}
body.paused .stage:after{content:'已暂停';position:absolute;z-index:50;inset:0;display:grid;place-items:center;background:rgba(5,4,7,.86);color:var(--paper);font-size:clamp(16px,2.4cqw,50px);letter-spacing:.5em}
</style></head><body><main><div class="stage"><img id="bg" alt=""><img id="openDoor" src="assets/scenes/school_classroom_open_pixel.png" alt="" hidden><img id="doorLeaf" src="assets/scenes/classroom_door_leaf.png" alt="" hidden><div id="people"></div><div id="ui"></div><div class="hud"><div class="topbar"><h1 class="act-heading"><b>第二幕</b> · <span id="sceneTitle">学校</span><span class="goal" id="status">E 推进</span></h1><span class="keys">WASD / 方向键 移动 · E 互动 · Esc 暂停 · R 重置</span></div></div></div></main><script>
const I='assets/scenes/',images={exterior:I+'school_exterior_pixel.png',door:I+'school_corridor_door_pixel.png',railing:I+'school_corridor_railing_pixel.png',classroom:I+'school_classroom_pixel.png',cg:I+'cg_doorway_wave_v2.png',lean:I+'cg_corridor_lean_back.png',leanTurn:I+'lean_turn/frame_00.png'};const leanFrames=Array.from({length:8},(_,i)=>I+'lean_turn/frame_'+String(i).padStart(2,'0')+'.png');leanFrames.forEach(src=>{let im=new Image();im.src=src});const bg=document.getElementById('bg'),openDoor=document.getElementById('openDoor'),doorLeaf=document.getElementById('doorLeaf'),people=document.getElementById('people'),ui=document.getElementById('ui'),status=document.getElementById('status'),sceneTitle=document.getElementById('sceneTitle'),stageEl=document.querySelector('.stage');const KEY='our-story-act2-corridor-flow-v2';let state='sky',talk=null,promptAction=null,paused=false,boardImage='',snack='',miss=0,walking=0,follow=0,raf=0,timer=0,boardReturnResult='';
function persist(){try{localStorage.setItem(KEY,JSON.stringify({state,boardImage,snack,miss,boardReturnResult}))}catch{}}function go(s){if(paused)return;clearTimeout(timer);cancelAnimationFrame(raf);state=s;persist();render()}function openBlackboard(fresh=false){state='boardPending';persist();let url=new URL('act2/blackboard.html?back=../school-preview.html',location.href);if(fresh)url.searchParams.set('fresh','1');location.href=url.href}const SCENE_NAMES={exterior:'校外',door:'走廊',railing:'走廊',classroom:'教室',cg:'教室门口',lean:'走廊',leanTurn:'走廊'};function scene(s){stageEl.classList.toggle('corridor-view',s==='railing'||s==='door');sceneTitle.textContent=SCENE_NAMES[s]||'学校';bg.hidden=false;bg.className='';bg.src=images[s];bg.alt=s;ui.replaceChildren();people.replaceChildren();openDoor.classList.remove('open');doorLeaf.classList.remove('swing');openDoor.hidden=true;doorLeaf.hidden=true;if(s==='classroom')classroomCrowd();if(s!=='cg'&&s!=='lean'&&s!=='leanTurn'&&s!=='railing')pixelate(bg,images[s])}const pixelCache=new Map();function pixelate(el,src){if(pixelCache.has(src)){el.src=pixelCache.get(src);return}let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=384;c.height=216;let cx=c.getContext('2d');cx.imageSmoothingEnabled=false;cx.drawImage(im,0,0,384,216);try{let out=c.toDataURL('image/png');pixelCache.set(src,out);if(el===bg&&images[bg.alt]===src)el.src=out}catch{if(el===bg&&images[bg.alt]===src)el.src=src}};im.src=src}function showDoor(animate=false){openDoor.hidden=false;if(animate){doorLeaf.hidden=false;void doorLeaf.offsetWidth;requestAnimationFrame(()=>{openDoor.classList.add('open');doorLeaf.classList.add('swing')})}else{openDoor.classList.add('open');doorLeaf.hidden=true}}function button(label,x,y,fn){promptAction=fn;let b=document.createElement('div');b.className='hot';b.innerHTML='<kbd>E</kbd><span></span>';b.querySelector('span').textContent=label;b.style.left=x+'%';b.style.top=y+'%';ui.append(b);return b}function panel(title,desc){let d=document.createElement('div');d.className='panel';d.innerHTML='<h2></h2><p></p>';d.querySelector('h2').textContent=title;d.querySelector('p').textContent=desc;ui.append(d);return d}function add(host,label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;host.append(b);return b}function row(host){let d=document.createElement('div');d.className='row';host.append(d);return d}function extra(x,bottom,width,girl){let a=document.createElement('div');a.className='extra'+(girl?' girl':'');a.style.left=x+'%';a.style.bottom=bottom+'%';a.style.width=width+'%';a.setAttribute('aria-label','其他学生坐在座位上');people.append(a);return a}function classroomCrowd(){let seats=[18.4,34.2,50,65.2,80.4],rows=[{bottom:36.5,width:5.2},{bottom:20.1,width:6},{bottom:3.4,width:6.7}];rows.forEach((row,r)=>seats.forEach((x,c)=>{if(r===1&&c===1)return;extra(x,row.bottom,row.width,(r+c)%2===0)}))}function actor(who,x){let a=document.createElement('div');a.className='actor '+who;a.style.left=x+'%';a.setAttribute('aria-label',who==='me'?'我':'她');people.append(a);return a}
function lines(items,end){let i=0,box=document.createElement('div');box.className='dialog';ui.append(box);requestAnimationFrame(()=>box.classList.add('show'));talk=box;function put(){if(i>=items.length){box.remove();talk=null;end?.();return}let [who,text]=items[i++];box.innerHTML='<b></b><p></p><small>E / 空格 / 点击</small>';box.querySelector('b').textContent=who;let p=box.querySelector('p'),j=0;function type(){if(!box.isConnected)return;p.textContent=text.slice(0,++j);if(j<text.length)timer=setTimeout(type,29)}type();box.advance=()=>{if(p.textContent.length<text.length){clearTimeout(timer);p.textContent=text}else put()};box.onclick=()=>box.advance()}put()}
function walkActorToDoor(me){me.classList.add('moving');let x=33,depth=20,steps=0,done=false;const AISLE=12.6,TOP=43;let p=document.createElement('div');p.className='door-controls';p.innerHTML='<p>按 <kbd>E</kbd> 一步步走到门前。方向键 / WASD 也可以自己走。</p>';ui.append(p);function move(dir){if(done||state!=='walkToDoor')return;let before=x+depth;if(dir==='left'&&depth===20)x=Math.max(AISLE,x-4.1);else if(dir==='right'&&depth===20)x=Math.min(33,x+4.1);else if(dir==='up'&&x<=AISLE)depth=Math.min(TOP,depth+4.6);else if(dir==='down'&&depth>20)depth=Math.max(20,depth-4.6);if(before===x+depth){status.textContent=x>AISLE?'先向左走出座位':'沿通道向门口走';return}let progress=(depth-20)/(TOP-20);me.style.left=(depth>20?AISLE+2.1*progress:x)+'%';me.style.bottom=depth+'%';let base={left:9,right:13,up:17,down:5}[dir];me.style.backgroundPosition=((base+(steps++%4))/22*100)+'% top';if(depth>=TOP){done=true;status.textContent='已经走到门前';setTimeout(()=>{if(state==='walkToDoor')go('doorArrival')},450)}}window.doorMove=move;window.doorAdvance=()=>{if(done||state!=='walkToDoor')return;move(x>AISLE+0.01?'left':'up')}}function animateExitClassroom(){scene('classroom');showDoor();let her=actor('her',7),me=actor('me',14.7);her.classList.add('at-door','exiting');me.classList.add('exiting');me.style.bottom='43%';me.style.backgroundPosition=(9/22*100)+'% top';her.style.backgroundPosition=(9/24*100)+'% top';requestAnimationFrame(()=>{her.style.left='1.5%';her.style.bottom='47%';her.style.width='4.5%';her.style.opacity='0';setTimeout(()=>{if(state!=='exitClassroom')return;me.style.left='6%';me.style.bottom='47%';me.style.width='4.5%';me.style.opacity='0'},260)});timer=setTimeout(()=>{if(state==='exitClassroom')go('corridorApproach')},1450)}function animateCorridorApproach(){scene('railing');let me=actor('me',25),her=actor('her',40);for(let a of [me,her]){a.classList.add('approaching');a.style.width='12%';a.style.bottom='8%'}let start=performance.now();function tick(now){if(state!=='corridorApproach')return;let t=Math.min(1,(now-start)/1900),ease=t*t*(3-2*t),step=Math.floor((now-start)/140)%4;me.style.left=(25+10*ease)+'%';her.style.left=(40+7*ease)+'%';for(let a of [me,her]){a.style.bottom=(8+16*ease)+'%';a.style.width=(12+4*ease)+'%'}me.style.backgroundPosition=((17+step)/22*100)+'% top';her.style.backgroundPosition=((17+step)/24*100)+'% top';if(t>=1){go('corridorTalk');return}raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}function playLeanTurn(end){let frame=0,delays=[150,110,110,110,110,110,150,650];function show(){if(state!=='hallway')return;bg.src=leanFrames[frame];if(frame===7){timer=setTimeout(end,delays[7]);return}timer=setTimeout(()=>{frame++;show()},delays[frame])}show()}function render(){talk=null;promptAction=null;status.textContent='E 推进';if(state==='sky'){scene('exterior');bg.className='camera-down';lines([['旁白','后来，我们又在学校里有了很多交集。']],()=>go('exterior'));return}if(state==='exterior'){scene('exterior');button('走进教学楼',51,62,()=>go('intro'));return}if(state==='intro'){scene('classroom');actor('me',33).classList.add('sitting');lines([['旁白','课间的教室很吵。我坐在座位上，望着黑板发了一会儿呆。']],()=>go('doorCall'));return}if(state==='doorCall'){scene('classroom');showDoor(true);actor('me',33).classList.add('sitting');actor('her',7).classList.add('at-door','waving');lines([['旁白','咔嗒——教室门被推开了。'],['她','和臣！']],()=>button('转头看向她',13,48,()=>go('meeting')));return}if(state==='meeting'){scene('cg');bg.className='cg-reveal';lines([['旁白','我转过头。她站在门口，笑着朝我挥了挥手。'],['她','和臣，出来一下？'],['我','好，马上来。']],()=>button('起身走到门前',50,80,()=>go('walkToDoor')));return}if(state==='walkToDoor'){scene('classroom');showDoor();actor('her',7).classList.add('at-door');let me=actor('me',33);me.style.bottom='20%';walkActorToDoor(me);return}if(state==='doorArrival'){scene('classroom');showDoor();actor('her',7).classList.add('at-door');let me=actor('me',14.7);me.style.bottom='43%';me.style.backgroundPosition=(2/22*100)+'% top';lines([['旁白','我绕过座位，穿过教室，走到了门前。'],['朱里','走吧。']],()=>button('跟她走出教室',14,58,()=>go('exitClassroom')));return}if(state==='exitClassroom'){animateExitClassroom();return}if(state==='corridorApproach'){animateCorridorApproach();return}if(state==='corridorTalk'){scene('railing');let me=actor('me',35),her=actor('her',47);me.style.backgroundPosition=(4/22*100)+'% top';her.style.backgroundPosition=(4/24*100)+'% top';lines([['朱里','你刚才在教室发呆了？'],['和臣','被你看出来了。'],['朱里','操场那边好像又在踢球。'],['和臣','嗯，隔着窗户也听得见。']],()=>button('靠在护栏上',50,70,()=>go('hallway')));return}if(state==='hallway'){scene('leanTurn');timer=setTimeout(()=>playLeanTurn(()=>lines([['朱里','和臣，我们明天一起画黑板报好不好？'],['和臣','好。明天课间，我和你一起画。'],['朱里','说好了！']],()=>button('第二天 · 去画黑板报',50,82,()=>go('boardIntro')))),700);return}if(state==='boardIntro'){scene('railing');lines([['旁白','第二天的课间，我按昨天的约定，朝走廊宣传栏走去。']],()=>button('走到黑板报前',50,76,openBlackboard));return}if(state==='boardPending'){scene('railing');let p=panel('走廊里的黑板报','之前的画还留着，可以继续，也可以从头画。');p.classList.add('choice-panel');let r=row(p);add(r,'接着画',()=>openBlackboard());add(r,'从头重画',()=>openBlackboard(true));add(r,'继续剧情（占位）',()=>go('nextPlaceholder'));return}if(state==='boardReturn'){scene('railing');if(boardReturnResult==='done'){lines([['旁白','我们在走廊里退后两步，一起看了看刚完成的黑板报。'],['朱里','明天路过这里，还能再看到它。'],['和臣','嗯。']],()=>button('继续',50,76,()=>go('snackIntro')))}else{lines([['旁白','黑板报还没画完。朱里把粉笔放好，留着下次继续。']],()=>go('boardPending'))}return}if(state==='nextPlaceholder'){scene('railing');let p=panel('后续剧情 · 待接入','这里暂时保留后续剧情的位置。黑板报的进度仍然留着，之后可以回来继续画。');p.classList.add('choice-panel');let r=row(p);add(r,'返回画黑板报',()=>go('boardPending'));return}if(state==='board'){go('boardPending');return}if(state==='snackIntro'){scene('railing');actor('me',36);actor('her',49);lines([['旁白','又一个课间，我们在走廊碰见。'],['她','吃不吃？'],['我','什么？']],()=>go('snack'));return}if(state==='snack'){scene('railing');actor('me',35);actor('her',48);snacks();return}if(state==='speechIntro'){scene('classroom');actor('me',38);actor('her',53);lines([['旁白','后来，我们又一起准备了广播稿。'],['她','准备好了吗？'],['我','应该吧。'],['她','那开始咯。']],()=>go('speech'));return}if(state==='speech'){scene('classroom');actor('me',38);actor('her',53);broadcast();return}if(state==='montage'){scene('door');actor('me',36);actor('her',50);lines([['旁白','那段时间，我们好像总有很多事情可以一起做。'],['旁白','有时候，我甚至觉得，那些很普通的事情，也变得有意思起来。']],()=>go('walk'));return}if(state==='walk'){scene('railing');walk();return}if(state==='chat'){scene('railing');actor('me',39);actor('her',49);chat();return}if(state==='ending'){scene('railing');actor('me',39);actor('her',49);lines([['旁白','后来想想，那时候的我们，好像总有说不完的话。'],['旁白','一起做的那些事，其实都很普通。'],['旁白','可我开始越来越期待，下一次见到她。']],()=>go('flashback'));return}if(state==='flashback'){scene('classroom');let p=panel('回忆闪回','教室门口、她递来的粉笔、一起分享的零食、广播时接上的那句话，还有走廊里的一段安静。');add(p,'继续',()=>go('end'));return}if(state==='end'){bg.hidden=true;ui.innerHTML='<div class="end"><small>也是在那些日子里……</small><div class="end-title">我慢慢喜欢上了她。</div><small>CHAPTER 02 / END<br>那些一起度过的日子</small><div class="hint">E 重新体验</div></div>';promptAction=()=>go('sky')}}
function blackboard(){let p=document.createElement('div');p.className='board-ui';p.innerHTML='<b>一起完成的黑板</b><p>直接在教室黑板上画；她会补上角落的装饰。</p>';ui.append(p);let colors=row(p),paint='#f6db9e',history=[],redo=[],marks=0,draw=false;for(let [name,c] of [['白','#f4ecdd'],['黄','#f6db9e'],['粉','#efaab4'],['蓝','#9acbdf']])add(colors,name,()=>paint=c);let cv=document.createElement('canvas');cv.width=384;cv.height=216;cv.className='board-in-room';ui.append(cv);let c=cv.getContext('2d');c.fillStyle='#285147';c.fillRect(0,0,384,216);if(boardImage){let im=new Image();im.onload=()=>c.drawImage(im,0,0);im.src=boardImage}function snapshot(){history.push(cv.toDataURL());if(history.length>30)history.shift();redo=[]}function restore(s){let im=new Image();im.onload=()=>c.drawImage(im,0,0);im.src=s}function point(e){let r=cv.getBoundingClientRect();return[(e.clientX-r.left)*384/r.width,(e.clientY-r.top)*216/r.height]}cv.onpointerdown=e=>{snapshot();draw=true;marks++;cv.setPointerCapture(e.pointerId);c.strokeStyle=paint;c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(...point(e))};cv.onpointermove=e=>{if(draw){c.lineTo(...point(e));c.stroke()}};cv.onpointerup=()=>draw=false;let tools=row(p);add(tools,'撤销',()=>{if(history.length){redo.push(cv.toDataURL());restore(history.pop())}});add(tools,'重做',()=>{if(redo.length){history.push(cv.toDataURL());restore(redo.pop())}});add(tools,'添加边框',()=>{snapshot();c.strokeStyle=paint;c.lineWidth=4;c.strokeRect(15,15,354,186);marks++});add(tools,'一起完成',()=>{if(!marks&&!boardImage){status.textContent='先画一些内容或添加边框';return}c.strokeStyle='#f1a9b2';for(let [x,y] of [[25,25],[359,25],[25,191],[359,191]]){c.beginPath();c.arc(x,y,9,0,7);c.stroke()}boardImage=cv.toDataURL();persist();lines([['她','这样就差不多啦。'],['我','还挺好看的。']],()=>go('snackIntro'))})}
function snacks(){let p=panel('分你一点','选择自己的一份零食递给她。物品和对白是占位，可按真实记忆修改。');let r=row(p);for(let item of ['饼干','糖果','面包']){let b=add(r,item,()=>{snack=item;[...r.children].forEach(x=>x.classList.toggle('selected',x===b))})}add(p,'递给她',()=>{if(!snack){status.textContent='先选一份零食';return}lines([['她','这个给你。'],['我','那我们一起吃。']],()=>go('speechIntro'))})}
function broadcast(){let p=panel('我们的声音','轮到“我”时，在光标接近绿色区域按空格或点击“接上”。错过时她会自然接续。广播空间的专用美术待制作。');let script=[['我','今天的校园，仍有很多普通的小事。'],['她','有些事，因为有人一起做而不同。'],['我','我们想把这份日常分享给大家。'],['她','谢谢收听。']],index=0,start=0,active=false;let sentence=document.createElement('h2'),track=document.createElement('div');track.className='track';track.innerHTML='<div class="cursor"></div>';p.append(sentence,track);let cur=track.firstChild,feedback=document.createElement('p');p.append(feedback);let b=add(p,'接上（空格）',()=>{if(!active)return;let t=(performance.now()-start)/3000;active=false;cancelAnimationFrame(raf);if(t<.44||t>.56)miss++;feedback.textContent=t>=.44&&t<=.56?'刚好接上。':'有一点停顿，但你们继续了。';index++;timer=setTimeout(advance,700)});b.id='speechButton';function advance(){if(index===script.length){lines([['我','终于结束了。'],['她','还好吧。']],()=>go('montage'));return}let [who,text]=script[index];sentence.textContent=who+'：'+text;if(who==='她'){feedback.textContent='她接续下一句。';index++;timer=setTimeout(advance,1100);return}feedback.textContent='轮到你了。';start=performance.now();active=true;function tick(now){if(state!=='speech'||!active)return;let t=(now-start)/3000;cur.style.left=Math.min(1,t)*100+'%';if(t>=1){active=false;miss++;feedback.textContent='你停顿了一下，她帮你接上。';index++;timer=setTimeout(advance,800)}else raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}advance()}
function walk(){let me=actor('me',walking||35),her=actor('her',follow||49);let p=panel('再待一会儿','沿走廊走一小段。你停下时，她会慢慢停在旁边。');p.style.inset='auto 5% 3%';p.style.height='auto';let r=row(p);add(r,'向左走',()=>move(-5));add(r,'向右走',()=>move(5));add(r,'停下来',()=>{follow=walking+10;her.style.left=follow+'%';status.textContent='她看见你停下，也走回了你身边。'});add(r,'靠着护栏聊天',()=>go('chat'));function move(dx){walking=Math.min(80,Math.max(10,(walking||35)+dx));me.style.left=walking+'%';timer=setTimeout(()=>{follow=walking+10;her.style.left=follow+'%'},320)}window.walkMove=move}
function chat(){let p=panel('再待一会儿','可以聊，也可以什么都不说。对白目前是占位稿。'),r=row(p),reply=document.createElement('p');p.append(reply);for(let [name,text] of [['今天发生的事','今天还挺累的。——是有一点。'],['一起做过的活动','刚才的事，还挺有意思。'],['学校里看到的事','操场那边好像还很热闹。'],['暂时不说话','你们安静地靠着护栏，听着远处的声音。']])add(r,name,()=>{reply.textContent=text;if(!p.querySelector('.finish')){let b=add(p,'再待一会儿',()=>go('ending'));b.className='finish'}})}
function togglePause(){paused=!paused;document.body.classList.toggle('paused',paused)}function restartAct2(){paused=false;document.body.classList.remove('paused');try{localStorage.removeItem(KEY)}catch{}state='sky';boardImage='';snack='';miss=0;walking=0;follow=0;boardReturnResult='';go('sky')}window.onkeydown=e=>{if(e.key==='Escape'){togglePause();return}if(paused)return;if(e.key==='r'||e.key==='R'){restartAct2();return}if((e.key==='e'||e.key==='E'||e.key==='Enter')&&!e.repeat){if(talk){talk.advance();return}if(state==='walkToDoor'){e.preventDefault();window.doorAdvance?.();return}if(promptAction){e.preventDefault();const fn=promptAction;promptAction=null;fn();return}}if(e.key===' '&&talk&&!e.repeat){e.preventDefault();talk.advance();return}if(e.key===' '&&state==='speech'){e.preventDefault();document.getElementById('speechButton')?.click()}if(state==='walkToDoor'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s','A','D','W','S'].includes(e.key)){e.preventDefault();let dir={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'}[e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase()];window.doorMove?.(dir);return}if(state==='walk'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();window.walkMove?.(e.key==='ArrowLeft'?-5:5)}};const launchParams=new URLSearchParams(location.search);if(launchParams.get('start')==='1'){try{localStorage.removeItem(KEY)}catch{}state='sky';boardImage='';snack='';miss=0;walking=0;follow=0;boardReturnResult='';try{history.replaceState(null,'',location.pathname)}catch{}}else{try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s?.state){state=s.state;boardImage=s.boardImage||'';snack=s.snack||'';miss=s.miss||0;boardReturnResult=s.boardReturnResult||''}}catch{}if(launchParams.get('from')==='blackboard'){boardReturnResult=launchParams.get('board')==='done'?'done':'paused';state='boardReturn';persist();try{history.replaceState(null,'',location.pathname)}catch{}}}render();
